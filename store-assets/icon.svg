<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e6e"/>
      <stop offset="1" stop-color="#1f7a52"/>
    </linearGradient>
  </defs>
  <!-- map background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- stylized roads -->
  <path d="M -8 88 Q 40 72 66 92 T 140 84" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  <path d="M 30 136 Q 44 96 34 64 T 44 -8" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/>
  <!-- restriction zone -->
  <circle cx="64" cy="60" r="38" fill="#e5484d" fill-opacity="0.42"/>
  <circle cx="64" cy="60" r="38" fill="none" stroke="#c62f35" stroke-width="6"/>
  <!-- drone silhouette -->
  <g fill="#ffffff" stroke="#ffffff">
    <!-- arms -->
    <path d="M 47 43 L 81 77 M 81 43 L 47 77" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- body -->
    <rect x="55" y="51" width="18" height="18" rx="6" stroke="none"/>
    <!-- rotors -->
    <circle cx="45" cy="41" r="10" stroke="none"/>
    <circle cx="83" cy="41" r="10" stroke="none"/>
    <circle cx="45" cy="79" r="10" stroke="none"/>
    <circle cx="83" cy="79" r="10" stroke="none"/>
    <!-- rotor hubs -->
    <circle cx="45" cy="41" r="3.5" fill="#1f7a52" stroke="none"/>
    <circle cx="83" cy="41" r="3.5" fill="#1f7a52" stroke="none"/>
    <circle cx="45" cy="79" r="3.5" fill="#1f7a52" stroke="none"/>
    <circle cx="83" cy="79" r="3.5" fill="#1f7a52" stroke="none"/>
  </g>
</svg>
